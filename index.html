<style>
/* Layout: program-booklet. Sticky masthead with language switch, a tabbed single page, date-block rows for the calendar. */
:root{
  --bg:#f2f3f7;
  --surface:#ffffff;
  --fg:#16182b;
  --muted:#5b6078;
  --line:#d9dbe6;
  --accent:#8a1c3b;
  --accent-fg:#ffffff;
  --accent-soft:#f3dfe6;
  --brass:#8a6a1f;
  --good:#1f7a4d;
  --font-display:'Cormorant Garamond','Noto Serif Georgian',Georgia,serif;
  --font-body:'Source Sans 3','Noto Sans Georgian',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12111a;--surface:#1b1a26;--fg:#ecebf5;--muted:#a3a1ba;--line:#33314a;
  --accent:#e0839f;--accent-fg:#1a0b11;--accent-soft:#3a1f2b;--brass:#d9b45c;--good:#62c993;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12111a;--surface:#1b1a26;--fg:#ecebf5;--muted:#a3a1ba;--line:#33314a;
  --accent:#e0839f;--accent-fg:#1a0b11;--accent-soft:#3a1f2b;--brass:#d9b45c;--good:#62c993;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto}
header.mast{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:12px 0;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.mast-top{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.brand{font-family:var(--font-display);font-size:1.7rem;font-weight:700;letter-spacing:.01em;line-height:1}
.brand small{display:block;font-family:var(--font-body);font-size:.72rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.langs{display:flex;gap:4px}
.langs button{font:600 .8rem var(--font-body);letter-spacing:.06em;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:6px 10px;border-radius:4px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:10px}
nav.tabs a{flex:0 0 auto;text-decoration:none;color:var(--muted);font-weight:600;font-size:.92rem;padding:10px 14px;border-bottom:3px solid transparent}
nav.tabs a[aria-current="true"]{color:var(--fg);border-bottom-color:var(--accent)}
main{padding-block:28px}
section.view{display:none}
section.view.on{display:block}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(2.3rem,6vw,3.8rem);line-height:1.02;margin:0 0 12px;text-wrap:balance}
h2{font-family:var(--font-display);font-size:1.9rem;line-height:1.1;margin:0 0 6px;text-wrap:balance}
h3{font-size:1rem;margin:0}
.lede{max-width:62ch;color:var(--muted);font-size:1.08rem;margin:0 0 20px}
.stamp{display:inline-flex;gap:8px;align-items:center;font-size:.8rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--brass)}
.stamp i{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:22px 0 32px}
.stat{border-top:2px solid var(--fg);padding-top:8px}
.stat b{display:block;font-family:var(--font-display);font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:.82rem;color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:32px}
@media (max-width:760px){.two{grid-template-columns:minmax(0,1fr)}}
.block-title{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--muted);margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:76px minmax(0,1fr);gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.date{text-align:center;border:1px solid var(--line);background:var(--surface);padding:6px 4px;align-self:start}
.date b{display:block;font-family:var(--font-display);font-size:1.7rem;line-height:1;font-variant-numeric:tabular-nums}
.date span{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.date em{display:block;font-style:normal;font-size:.7rem;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.row .t{font-family:var(--font-display);font-weight:700;font-size:1.35rem;line-height:1.15;margin:0}
.row .t a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line)}
.row .t a:hover{border-bottom-color:var(--accent)}
.meta{font-size:.88rem;color:var(--muted);margin-top:2px}
.note{margin:6px 0 0;max-width:64ch}
.tag{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border:1px solid var(--accent);color:var(--accent);margin-right:6px;vertical-align:2px}
.tag.world{background:var(--accent);color:var(--accent-fg)}
.tag.plain{border-color:var(--line);color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 8px}
.filters label{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;flex-direction:column;gap:4px}
select{font:inherit;padding:8px 10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:4px;min-width:180px;max-width:100%}
.seg{display:flex}
.seg button{font:600 .85rem var(--font-body);padding:9px 14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.seg button+button{border-left:0}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.empty{padding:24px 0;color:var(--muted)}
.review{padding:16px 0;border-bottom:1px solid var(--line)}
.review h3{font-family:var(--font-display);font-size:1.4rem;font-weight:700}
.review p{margin:6px 0 0;max-width:66ch}
.src{font-size:.85rem}
.hero-nino{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;padding:22px 0 8px;border-bottom:1px solid var(--line);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.chip{font-size:.82rem;padding:4px 10px;border:1px solid var(--line);background:var(--surface)}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:92px minmax(0,1fr);gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
@media (max-width:480px){.tl li{grid-template-columns:minmax(0,1fr);gap:2px}}
.tl .y{font-family:var(--font-display);font-weight:700;font-size:1.3rem;color:var(--accent);font-variant-numeric:tabular-nums}
.tl p{margin:0}
.links{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:6px;font-size:.9rem}
.notice{border-left:3px solid var(--brass);padding:8px 14px;background:var(--surface);margin:18px 0;font-size:.92rem;max-width:70ch}
footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);font-size:.85rem;color:var(--muted);max-width:70ch}
@media (prefers-reduced-motion:no-preference){section.view.on{animation:in .25s ease-out}@keyframes in{from{opacity:.0;transform:translateY(4px)}to{opacity:1;transform:none}}}

.stat b,.date b,h1,.tl .y,.review h3{font-variant-numeric:lining-nums tabular-nums}
.stat b{font-variant-numeric:lining-nums tabular-nums}

:root{--velvet-1:#5a0f26;--velvet-2:#7d1a39;--velvet-3:#3b0a19;--gold:#e9d08f}
.hero{position:relative;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:44px max(16px,env(safe-area-inset-left,0px)) 36px;color:#fbf3f5;
  background:linear-gradient(180deg,rgba(0,0,0,.0) 55%,rgba(0,0,0,.45) 100%),repeating-linear-gradient(90deg,var(--velvet-1) 0,var(--velvet-2) 26px,var(--velvet-3) 52px,var(--velvet-2) 78px,var(--velvet-1) 104px)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.hero-in{max-width:980px;margin:0 auto}
.hero h1{color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.35)}
.hero .lede{color:#f0dfe4}
.hero .stamp{color:var(--gold)}
.hero .chip{background:rgba(0,0,0,.28);border-color:rgba(233,208,143,.45);color:#fbf3f5}
.nino-hero{display:flex;flex-wrap:wrap;gap:28px;align-items:center;justify-content:center}
.nino-hero .hero-in{flex:1 1 320px;min-width:0;margin:0}
.portrait{flex:0 0 auto;width:min(240px,100%);aspect-ratio:4/5;border:3px solid var(--gold);background:linear-gradient(160deg,var(--velvet-2),var(--velvet-3)) center/cover no-repeat;display:grid;place-items:center;font-family:var(--font-display);font-size:4rem;font-weight:700;color:var(--gold)}
.portrait.has span,.hc-img.has span{display:none}
.pcred{font-size:.8rem;margin:12px 0 0}.pcred a{color:var(--gold)}
.houses{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.hcard{display:block;text-decoration:none;color:inherit;border:1px solid var(--line);background:var(--surface)}
.hcard:hover{border-color:var(--accent)}
.hc-img{aspect-ratio:16/10;background:linear-gradient(160deg,var(--velvet-2),var(--velvet-3)) center/cover no-repeat;display:grid;place-items:center;font-family:var(--font-display);font-size:2.4rem;font-weight:700;color:var(--gold)}
.hc-t{padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.hc-t b{font-family:var(--font-display);font-size:1.12rem;line-height:1.15}
.hc-t span{font-size:.82rem;color:var(--muted)}
.vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.vcard{display:flex;flex-direction:column;gap:6px;padding:14px;text-decoration:none;color:inherit;border:1px solid var(--line);background:var(--surface);min-width:0}
.vcard:hover{border-color:var(--accent)}
.vcard .play{width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-size:.9rem;padding-left:3px}
.vcard b{font-family:var(--font-display);font-size:1.15rem;line-height:1.15}
.vcard small{color:var(--muted)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}.gal figure{margin:0;border:1px solid var(--line);background:var(--surface)}.gal img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover}.gal figcaption{font-size:.8rem;color:var(--muted);padding:6px 8px}
.bio{max-width:72ch}.bio h3{font-family:var(--font-display);font-size:1.35rem;margin:20px 0 4px;color:var(--accent)}.bio p{margin:0 0 10px}
.rcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:12px}.rcard{border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-width:0}.rph{display:block;background:linear-gradient(160deg,var(--velvet-2),var(--velvet-3))}.rph img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover}.rph.noimg{display:none}.rb{padding:12px 14px}.rb>b{font-family:var(--font-display);font-size:1.15rem}.rq{margin:10px 0 0;padding:0 0 0 12px;border-left:3px solid var(--brass)}.rq p{margin:0 0 4px;font-style:italic}.rq .qo{display:block;color:var(--muted);font-size:.78rem;margin-bottom:4px}.rq footer{font-size:.84rem;color:var(--muted)}.rq .tr{font-size:.75rem}.rmore{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px 24px;margin-top:16px}

/* --- theatre look: velvet curtains, gold trim, paper panel --- */
:root{--panel:rgba(255,252,247,.97);--panel-line:rgba(138,28,59,.14);--gold-2:#c9a24a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:rgba(27,26,38,.96);--panel-line:rgba(233,208,143,.18)}}
:root[data-theme="dark"]{--panel:rgba(27,26,38,.96);--panel-line:rgba(233,208,143,.18)}
html{background:#2a0713}
body{background-color:#3b0a19;background-image:
 radial-gradient(ellipse 70% 38% at 50% 0%,rgba(255,214,140,.38),rgba(255,214,140,0) 70%),
 repeating-linear-gradient(90deg,rgba(0,0,0,.30) 0 2px,rgba(255,255,255,.00) 2px 22px,rgba(255,120,150,.10) 22px 34px,rgba(0,0,0,.26) 34px 38px,rgba(255,255,255,0) 38px 64px),
 linear-gradient(180deg,#5a0f26 0%,#3b0a19 55%,#260610 100%);
 background-attachment:fixed;background-size:100% 100%,auto,100% 100%;color:var(--fg)}
header.mast{background:linear-gradient(180deg,rgba(26,6,13,.94),rgba(48,9,22,.88));backdrop-filter:blur(6px);border-bottom:1px solid var(--gold-2);color:#fbf3f5;box-shadow:0 6px 18px rgba(0,0,0,.35)}
header.mast .brand{color:#f6e3b0}header.mast .brand small{color:#e8c9d2}
.langs button{border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(233,208,143,.5);color:#f6e3b0;padding:6px 13px;transition:background .15s,transform .15s}
.langs button:hover{background:rgba(233,208,143,.22);transform:translateY(-1px)}
.langs button[aria-pressed="true"]{background:linear-gradient(180deg,#e9d08f,#c9a24a);border-color:#e9d08f;color:#2a0713}
nav.tabs{gap:8px;padding:2px 0 10px;scrollbar-width:none}nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{color:#f1d9df;border:1px solid rgba(233,208,143,.35);border-radius:999px;padding:8px 16px;background:rgba(255,255,255,.06);transition:background .15s,transform .15s,color .15s}
nav.tabs a:hover{background:rgba(233,208,143,.2);transform:translateY(-1px)}
nav.tabs a[aria-current="true"]{background:linear-gradient(180deg,#e9d08f,#c9a24a);color:#2a0713;border-color:#e9d08f;box-shadow:0 2px 8px rgba(0,0,0,.35)}
main>.wrap{background:var(--panel);margin-top:22px;padding:18px clamp(14px,3vw,30px) 28px;border:1px solid var(--gold-2);border-radius:6px;box-shadow:0 18px 50px rgba(0,0,0,.5)}
.seg button{border-radius:999px}.seg button+button{border-left:1px solid var(--line);margin-left:4px}
.chip{border-radius:999px}
.links a{display:inline-block;border:1px solid var(--accent);border-radius:999px;padding:4px 12px;margin:0 6px 6px 0;text-decoration:none;font-weight:600;font-size:.88rem;transition:background .15s,color .15s}
.links a:hover{background:var(--accent);color:var(--accent-fg)}
footer{color:var(--muted)}
</style>

function fmt(iso,opt){

    return '<a class="hcard" href="#cal" data-house="'+k+'"><div class="hc-img" data-wiki="'+esc(H.w||"")+'" data-img="'+esc(H.img||"")+'"><span>'+esc(initials(H.n))+'</span></div><div class="hc-t"><b>'+esc(H.n)+'</b><span>'+esc(city(k))+' · '+n+' '+esc(u.hn)+'</span></div></a>';
  }).join("")+'</div><p class="meta">'+esc(u.hcred)+'</p>';
}
function qHtml(q){
  var main=q.t[lang]||q.o,orig=(lang!==q.ol)?'<small class="qo">'+({it:"Italiano",en:"English"}[q.ol]||q.ol)+': „'+esc(q.o)+'“</small>':'';
  return '<blockquote class="rq"><p>„'+esc(main)+'“</p>'+orig+'<footer>— '+esc(q.a)+', '+esc(q.s)+(q.u?' <a href="'+esc(q.u)+'" target="_blank" rel="noopener">↗</a>':'')+(lang!==q.ol?' <em class="tr">('+({ka:"თარგმანი ჩვენია",en:"our translation",it:"traduzione nostra"})[lang]+')</em>':'')+'</footer></blockquote>';
}
function revBlock(){
  var R=DATA.nino.rev;if(!R)return "";
  return '<h2 class="block-title" style="margin-top:28px">'+esc(T(R.title))+'</h2><p class="meta">'+esc(T(R.note))+'</p><div class="rcards">'+R.cards.map(function(c){
    return '<article class="rcard"><a class="rph" href="'+esc(c.img)+'" target="_blank" rel="noopener"><img loading="lazy" src="'+esc(c.img)+'" alt="'+esc(T(c.cap))+'" onerror="this.parentNode.classList.add(\'noimg\')"></a><div class="rb"><b>'+esc(T(c.cap))+'</b>'+c.q.map(qHtml).join("")+'</div></article>';
  }).join("")+'</div>'+(R.more&&R.more.length?'<div class="rmore">'+R.more.map(qHtml).join("")+'</div>':'');
}
function bioBlock(){
  var B=DATA.nino.bio||[];if(!B.length)return "";
  var H={ka:"ბიოგრაფია",en:"Biography",it:"Biografia"},F={ka:"ბიოგრაფია შედგენილია არტისტის ოფიციალური ბიოგრაფიის მიხედვით, რომელიც საიტის მფლობელმა მოგვაწოდა; ტექსტი ერთ სტილშია გამართული და თარგმნილია.",en:"Biography based on the artist's official biography supplied by the site owner; edited into one style and translated.",it:"Biografia basata sulla biografia ufficiale dell'artista fornita dal proprietario del sito; redatta in uno stile uniforme e tradotta."};
  return '<h2 class="block-title" style="margin-top:22px">'+H[lang]+'</h2><div class="bio">'+B.map(function(s){
    return '<h3>'+esc(T(s.h))+'</h3>'+T(s.p).split("\n\n").map(function(p){return '<p>'+esc(p)+'</p>'}).join("");
  }).join("")+'</div><p class="meta">'+F[lang]+'</p>';
}
function galleryBlock(){
  var G=DATA.nino.gallery||[];if(!G.length)return "";
  return '<h2 class="block-title" style="margin-top:28px">'+({ka:"ფოტოგალერეა",en:"Photo gallery",it:"Galleria fotografica"})[lang]+'</h2><div class="gal">'+G.map(function(g){return '<figure><img loading="lazy" src="'+esc(g.src)+'" alt="'+esc(T(g.c||{}))+'"><figcaption>'+esc(T(g.c||{}))+'</figcaption></figure>'}).join("")+'</div>';
}
function videoBlock(){
  var u=UI[lang];
  return '<h2 class="block-title" style="margin-top:28px">'+esc(u.vt)+'</h2><div class="vids">'+(DATA.nino.videos||[]).map(function(v){
    return '<a class="vcard" href="https://www.youtube.com/results?search_query='+encodeURIComponent(v.q)+'" target="_blank" rel="noopener"><span class="play">▶</span><b>'+esc(T(v.t))+'</b><small>'+esc(u.vwatch)+' ↗</small></a>';
  }).join("")+'</div><p class="meta">'+esc(u.vnote)+'</p>';
}
var WC={};
function wiki(title){
  if(!WC[title])WC[title]=fetch("https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(title)).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){var t=j.thumbnail&&j.thumbnail.source;return t?t.replace(/\/\d+px-/,"/500px-"):null}).catch(function(){return null});
  return WC[title];
}
function hydrate(){
  Array.prototype.forEach.call(document.querySelectorAll("[data-bg]"),function(el){
    var L=el.getAttribute("data-bg").split("|"),t=L[Math.floor(Math.random()*L.length)];
    wiki(t).then(function(src){if(!src)return;var big=src.replace(/\/500px-/,"/960px-"),im=new Image();
      function put(u){el.style.backgroundImage='linear-gradient(180deg,rgba(59,10,25,.55),rgba(59,10,25,.82)),url("'+u+'")';el.style.backgroundSize="cover";el.style.backgroundPosition="center"}
      im.onload=function(){put(big)};im.onerror=function(){var i2=new Image();i2.onload=function(){put(src)};i2.src=src};im.src=big});
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-wiki],[data-img]"),function(el){
    var own=el.getAttribute("data-img"),w=el.getAttribute("data-wiki");
    function put(src){if(!src)return;var im=new Image();im.onload=function(){el.style.backgroundImage='url("'+src+'")';el.classList.add("has")};im.src=src}
    if(own){put(own);return}
    if(w)wiki(w).then(put);
  });
}

var RENDER={ov:vOverview,cal:vCalendar,pre:vPremieres,rev:vReviews,tbs:vTbilisi,nino:vNino};
function render(){
  var u=UI[lang];
  document.documentElement.lang=lang;
  document.getElementById("tagline").textContent=u.tag;
  document.getElementById("tabs").innerHTML=VIEWS.map(function(v){return '<a href="#'+v+'" data-v="'+v+'" aria-current="'+(v===view)+'">'+esc(u[v])+'</a>'}).join("");
  Array.prototype.forEach.call(document.querySelectorAll("#langs button"),function(b){b.setAttribute("aria-pressed",String(b.getAttribute("data-l")===lang))});
  document.getElementById("app").innerHTML='<section class="view on">'+RENDER[view]()+'</section><footer>'+esc(u.foot)+'</footer>';
  hydrate();
  var sel=document.getElementById("hsel");
  if(sel)sel.addEventListener("change",function(){hf=sel.value;render()});
  Array.prototype.forEach.call(document.querySelectorAll(".seg button"),function(b){b.addEventListener("click",function(){time=b.getAttribute("data-t");render()})});
  document.title="Opera Atlas";
}
document.getElementById("langs").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  lang=b.getAttribute("data-l");
  try{localStorage.setItem("oa-lang",lang)}catch(x){}
  render();
});
document.getElementById("app").addEventListener("click",function(e){
  var a=e.target.closest("[data-house]");if(!a)return;
  e.preventDefault();hf=a.getAttribute("data-house");time="up";view="cal";
  try{history.replaceState(null,"","#cal")}catch(x){}
  render();window.scrollTo(0,0);
});
document.getElementById("tabs").addEventListener("click",function(e){
  var a=e.target.closest("a");if(!a)return;
  e.preventDefault();view=a.getAttribute("data-v");
  try{history.replaceState(null,"","#"+view)}catch(x){}
  render();window.scrollTo(0,0);
});
function boot(){
  var a=fetch("data.json",{cache:"no-store"}).then(function(r){return r.json()});
  var b=fetch("feed.json",{cache:"no-store"}).then(function(r){return r.json()}).catch(function(){return FEED});
  Promise.all([a,b]).then(function(x){DATA=x[0];FEED=x[1];render()}).catch(function(){document.getElementById("app").textContent="data.json not found"});
}
boot();
})();
</script>
