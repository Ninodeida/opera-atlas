<style>
/* Layout: program-booklet. Sticky masthead with language switch, a tabbed single page, date-block rows for the calendar. */
:root{
  --bg:#f2f3f7;
  --surface:#ffffff;
  --fg:#16182b;
  --muted:#5b6078;
  --line:#d9dbe6;
  --accent:#8a1c3b;
  --accent-fg:#ffffff;
  --accent-soft:#f3dfe6;
  --brass:#8a6a1f;
  --good:#1f7a4d;
  --font-display:'Cormorant Garamond','Noto Serif Georgian',Georgia,serif;
  --font-body:'Source Sans 3','Noto Sans Georgian',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12111a;--surface:#1b1a26;--fg:#ecebf5;--muted:#a3a1ba;--line:#33314a;
  --accent:#e0839f;--accent-fg:#1a0b11;--accent-soft:#3a1f2b;--brass:#d9b45c;--good:#62c993;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12111a;--surface:#1b1a26;--fg:#ecebf5;--muted:#a3a1ba;--line:#33314a;
  --accent:#e0839f;--accent-fg:#1a0b11;--accent-soft:#3a1f2b;--brass:#d9b45c;--good:#62c993;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto}
header.mast{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:12px 0;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.mast-top{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.brand{font-family:var(--font-display);font-size:1.7rem;font-weight:700;letter-spacing:.01em;line-height:1}
.brand small{display:block;font-family:var(--font-body);font-size:.72rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.langs{display:flex;gap:4px}
.langs button{font:600 .8rem var(--font-body);letter-spacing:.06em;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:6px 10px;border-radius:4px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:10px}
nav.tabs a{flex:0 0 auto;text-decoration:none;color:var(--muted);font-weight:600;font-size:.92rem;padding:10px 14px;border-bottom:3px solid transparent}
nav.tabs a[aria-current="true"]{color:var(--fg);border-bottom-color:var(--accent)}
main{padding-block:28px}
section.view{display:none}
section.view.on{display:block}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(2.3rem,6vw,3.8rem);line-height:1.02;margin:0 0 12px;text-wrap:balance}
h2{font-family:var(--font-display);font-size:1.9rem;line-height:1.1;margin:0 0 6px;text-wrap:balance}
h3{font-size:1rem;margin:0}
.lede{max-width:62ch;color:var(--muted);font-size:1.08rem;margin:0 0 20px}
.stamp{display:inline-flex;gap:8px;align-items:center;font-size:.8rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--brass)}
.stamp i{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:22px 0 32px}
.stat{border-top:2px solid var(--fg);padding-top:8px}
.stat b{display:block;font-family:var(--font-display);font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:.82rem;color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:32px}
@media (max-width:760px){.two{grid-template-columns:minmax(0,1fr)}}
.block-title{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--muted);margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:76px minmax(0,1fr);gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.date{text-align:center;border:1px solid var(--line);background:var(--surface);padding:6px 4px;align-self:start}
.date b{display:block;font-family:var(--font-display);font-size:1.7rem;line-height:1;font-variant-numeric:tabular-nums}
.date span{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.date em{display:block;font-style:normal;font-size:.7rem;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.row .t{font-family:var(--font-display);font-weight:700;font-size:1.35rem;line-height:1.15;margin:0}
.row .t a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line)}
.row .t a:hover{border-bottom-color:var(--accent)}
.meta{font-size:.88rem;color:var(--muted);margin-top:2px}
.note{margin:6px 0 0;max-width:64ch}
.tag{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border:1px solid var(--accent);color:var(--accent);margin-right:6px;vertical-align:2px}
.tag.world{background:var(--accent);color:var(--accent-fg)}
.tag.plain{border-color:var(--line);color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 8px}
.filters label{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;flex-direction:column;gap:4px}
select{font:inherit;padding:8px 10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:4px;min-width:180px;max-width:100%}
.seg{display:flex}
.seg button{font:600 .85rem var(--font-body);padding:9px 14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.seg button+button{border-left:0}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.empty{padding:24px 0;color:var(--muted)}
.review{padding:16px 0;border-bottom:1px solid var(--line)}
.review h3{font-family:var(--font-display);font-size:1.4rem;font-weight:700}
.review p{margin:6px 0 0;max-width:66ch}
.src{font-size:.85rem}
.hero-nino{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;padding:22px 0 8px;border-bottom:1px solid var(--line);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.chip{font-size:.82rem;padding:4px 10px;border:1px solid var(--line);background:var(--surface)}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:92px minmax(0,1fr);gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
@media (max-width:480px){.tl li{grid-template-columns:minmax(0,1fr);gap:2px}}
.tl .y{font-family:var(--font-display);font-weight:700;font-size:1.3rem;color:var(--accent);font-variant-numeric:tabular-nums}
.tl p{margin:0}
.links{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:6px;font-size:.9rem}
.notice{border-left:3px solid var(--brass);padding:8px 14px;background:var(--surface);margin:18px 0;font-size:.92rem;max-width:70ch}
footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);font-size:.85rem;color:var(--muted);max-width:70ch}
@media (prefers-reduced-motion:no-preference){section.view.on{animation:in .25s ease-out}@keyframes in{from{opacity:.0;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>

  var where=r.h?hname(r.h)+", "+city(r.h):r.place;
  return '<div class="review"><h3>'+esc(r.w)+'</h3><div class="meta">'+esc(where)+' · '+esc(fmt(r.d,r.d.length>4?{month:"long",year:"numeric"}:{year:"numeric"}))+(r.nino?' · <span class="tag plain">'+esc(u.nino)+'</span>':'')+'</div>'+
   '<p>'+esc(T(r.t))+'</p><p class="src">'+esc(u.src)+': '+esc(r.src)+' · <a href="'+esc(r.u)+'" target="_blank" rel="noopener">'+esc(u.read)+' ↗</a></p></div>';
}
function links(arr){return '<div class="links">'+arr.map(function(x){return '<a href="'+esc(x[1])+'" target="_blank" rel="noopener">'+esc(x[0])+' ↗</a>'}).join("")+'</div>'}

function vOverview(){
  var u=UI[lang],up=sorted(DATA.events.filter(isUp));
  var prem=up.filter(function(e){return e.ty==="world"||e.ty==="cpremiere"});
  var hs={};up.forEach(function(e){hs[e.h]=1});
  var nx=up.slice(0,5);
  var h='<span class="stamp"><i></i>'+esc(u.upd)+': '+esc(fmt(DATA.updated,{day:"numeric",month:"long",year:"numeric"}))+'</span>'+
   '<h1>'+esc(u.h1)+'</h1><p class="lede">'+esc(u.lede)+'</p>'+
   '<div class="stats"><div class="stat"><b>'+up.length+'</b><span>'+esc(u.s1)+'</span></div><div class="stat"><b>'+prem.length+'</b><span>'+esc(u.s2)+'</span></div><div class="stat"><b>'+Object.keys(hs).length+'</b><span>'+esc(u.s3)+'</span></div><div class="stat"><b>'+DATA.reviews.length+'</b><span>'+esc(u.s4)+'</span></div></div>'+
   '<div class="two"><div><h2 class="block-title">'+esc(u.next)+'</h2>'+nx.map(eventRow).join("")+'</div>'+
   '<div><h2 class="block-title">'+esc(u.news)+'</h2>'+DATA.news.map(function(n){return '<div class="review"><div class="meta">'+esc(hname(n.h))+' · '+esc(fmt(n.d,n.d.length>7?{day:"numeric",month:"short",year:"numeric"}:{month:"long",year:"numeric"}))+'</div><p>'+esc(T(n.t))+' <a href="'+esc(n.u)+'" target="_blank" rel="noopener">'+esc(u.src)+' ↗</a></p></div>'}).join("")+'</div></div>';
  h+=feedBlock(false);
  return h;
}
function feedBlock(ninoOnly){
  var u=UI[lang];
  var items=(FEED.items||[]).filter(function(i){return !ninoOnly||i.nino}).slice(0,ninoOnly?10:8);
  if(!items.length)return "";
  return '<h2 class="block-title" style="margin-top:28px">'+esc(ninoOnly?u.fn:u.fh)+'</h2>'+items.map(function(i){
    return '<div class="review"><div class="meta">'+esc(i.source||"")+(i.date?' · '+esc(fmt(i.date,{day:"numeric",month:"short",year:"numeric"})):'')+'</div><p><a href="'+esc(i.link)+'" target="_blank" rel="noopener">'+esc(i.title)+' ↗</a></p></div>';
  }).join("")+'<p class="meta">'+esc(u.fnote)+'</p>';
}
function vCalendar(){
  var u=UI[lang];
  var opts='<option value="all">'+esc(u.allh)+'</option>'+Object.keys(DATA.houses).filter(function(k){return DATA.events.some(function(e){return e.h===k})}).map(function(k){return '<option value="'+k+'"'+(hf===k?' selected':'')+'>'+esc(hname(k))+'</option>'}).join("");
  var list=sorted(DATA.events.filter(function(e){return (time==="up"?isUp(e):!isUp(e))&&(hf==="all"||e.h===hf)}));
  if(time==="past")list.reverse();
  return '<h2>'+esc(u.ct)+'</h2><div class="filters"><label>'+esc(u.house)+'<select id="hsel">'+opts+'</select></label>'+
   '<div><div style="font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px">'+esc(u.show)+'</div><div class="seg"><button data-t="up" aria-pressed="'+(time==="up")+'">'+esc(u.up)+'</button><button data-t="past" aria-pressed="'+(time==="past")+'">'+esc(u.past)+'</button></div></div></div>'+
   (list.length?list.map(eventRow).join(""):'<p class="empty">'+esc(u.none)+'</p>');
}
function vPremieres(){
  var u=UI[lang];
  var list=sorted(DATA.events.filter(function(e){return e.ty==="world"||e.ty==="cpremiere"||e.ty==="new"}));
  var world=list.filter(function(e){return e.ty==="world"}),cp=list.filter(function(e){return e.ty==="cpremiere"}),nw=list.filter(function(e){return e.ty==="new"});
  function grp(title,arr){return arr.length?'<h2 class="block-title" style="margin-top:22px">'+esc(title)+'</h2>'+arr.map(eventRow).join(""):""}
  return '<h2>'+esc(u.pt)+'</h2>'+grp(u.ty.world,world)+grp(u.ty.cpremiere,cp)+grp(u.ty.new,nw);
}
function vReviews(){
  var u=UI[lang];
  var list=DATA.reviews.slice().sort(function(a,b){return a.d<b.d?1:-1});
  return '<h2>'+esc(u.rt)+'</h2>'+list.map(reviewBlock).join("");
}
function vNino(){
  var u=UI[lang],N=DATA.nino;
  var h='<div class="hero-nino"><span class="stamp">'+esc(u.nt)+'</span><h1>'+esc(u.nino)+'</h1>'+
   '<div class="chips">'+N.awards.map(function(a){return '<span class="chip">'+esc(T(a))+'</span>'}).join("")+'</div></div>'+
   '<div class="notice">'+esc(u.note1)+'</div>'+
   '<h2 class="block-title" style="margin-top:22px">'+esc(u.nl)+'</h2><ul class="tl">'+
   N.timeline.map(function(x){return '<li><span class="y">'+esc(x.y)+'</span><div><p>'+esc(T(x.t))+'</p>'+links(x.l)+'</div></li>'}).join("")+'</ul>'+
   '<h2 class="block-title" style="margin-top:28px">'+esc(u.nu)+'</h2><ul class="tl">'+
   N.upcoming.map(function(x){return '<li><span class="y">→</span><div><p>'+esc(T(x.t))+'</p>'+links(x.l)+'</div></li>'}).join("")+'</ul>'+
   '<h2 class="block-title" style="margin-top:28px">'+esc(u.nroles)+'</h2><p style="max-width:70ch">'+esc(T(N.roles))+'</p>'+
   '<h2 class="block-title" style="margin-top:28px">'+esc(u.nr)+'</h2>'+DATA.reviews.filter(function(r){return r.nino}).map(reviewBlock).join("")+
   feedBlock(true)+'<h2 class="block-title" style="margin-top:28px">'+esc(u.nlink)+'</h2>'+links(N.links);
  return h;
}

var RENDER={ov:vOverview,cal:vCalendar,pre:vPremieres,rev:vReviews,nino:vNino};
function render(){
  var u=UI[lang];
  document.documentElement.lang=lang;
  document.getElementById("tagline").textContent=u.tag;
  document.getElementById("tabs").innerHTML=VIEWS.map(function(v){return '<a href="#'+v+'" data-v="'+v+'" aria-current="'+(v===view)+'">'+esc(u[v])+'</a>'}).join("");
  Array.prototype.forEach.call(document.querySelectorAll("#langs button"),function(b){b.setAttribute("aria-pressed",String(b.getAttribute("data-l")===lang))});
  document.getElementById("app").innerHTML='<section class="view on">'+RENDER[view]()+'</section><footer>'+esc(u.foot)+'</footer>';
  var sel=document.getElementById("hsel");
  if(sel)sel.addEventListener("change",function(){hf=sel.value;render()});
  Array.prototype.forEach.call(document.querySelectorAll(".seg button"),function(b){b.addEventListener("click",function(){time=b.getAttribute("data-t");render()})});
  document.title="Opera Atlas";
}
document.getElementById("langs").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  lang=b.getAttribute("data-l");
  try{localStorage.setItem("oa-lang",lang)}catch(x){}
  render();
});
document.getElementById("tabs").addEventListener("click",function(e){
  var a=e.target.closest("a");if(!a)return;
  e.preventDefault();view=a.getAttribute("data-v");
  try{history.replaceState(null,"","#"+view)}catch(x){}
  render();window.scrollTo(0,0);
});
function boot(){
  var a=fetch("data.json",{cache:"no-store"}).then(function(r){return r.json()});
  var b=fetch("feed.json",{cache:"no-store"}).then(function(r){return r.json()}).catch(function(){return FEED});
  Promise.all([a,b]).then(function(x){DATA=x[0];FEED=x[1];render()}).catch(function(){document.getElementById("app").textContent="data.json not found"});
}
boot();
})();
</script>
